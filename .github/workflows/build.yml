name: Build Bruce T-Embed CC1101

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
     uses: actions/upload-artifact@v4
        with:
          submodules: recursive

      - uses: actions/cache@v3
        with:
          path: ~/.platformio
          key: platformio-${{ hashFiles('**/platformio.ini') }}

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - run: pip install platformio

      - run: pio run -e lilygo-t-embed-cc1101

      - uses: actions/upload-artifact@v3
        with:
          name: bruce-t-embed-cc1101
          path: .pio/build/lilygo-t-embed-cc1101/firmware.bin
